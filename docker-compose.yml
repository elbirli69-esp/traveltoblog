services:
  traveltoblog:
    build: .
    container_name: traveltoblog
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/travel.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - traveltoblog-data:/app/data
      - traveltoblog-uploads:/app/public/uploads

volumes:
  traveltoblog-data:
  traveltoblog-uploads:
